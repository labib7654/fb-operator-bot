name: FB Operator 24/7 Cloud Bot (Real Desktop Environment)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'fb_operator_vault.json'
  workflow_dispatch:
  schedule:
    # يتجدد التشغيل تلقائياً كل 5 ساعات ليبقى شغالاً في السحاب 24/7 دون توقف
    - cron: '0 */5 * * *'

concurrency:
  group: fb-operator-24-7-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-fb-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 🐍 إعداد بايثون 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🖥️ تثبيت بيئة سطح المكتب والمتصفح واعتماديات التشغيل
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            x11-utils \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-extra \
            fonts-noto-ui-core \
            fonts-noto-color-emoji

          # تثبيت متطلبات بايثون ومتصفح Chromium بكامل مكتبات النظام المتوافقة مع أوبونتو تلقائياً
          if [ -d "HUGGINGFACE_UPLOAD" ]; then
            pip install -r HUGGINGFACE_UPLOAD/requirements.txt
            playwright install --with-deps chromium
          else
            pip install -r requirements.txt
            playwright install --with-deps chromium
          fi

      - name: 🚀 تشغيل البوت في بيئة ديسكتوب حقيقية 1920x1080 (Xvfb Real Display)
        env:
          _SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FB_VAULT_KEY: ${{ secrets.FB_VAULT_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$_SECRET_BOT_TOKEN" ]; then export BOT_TOKEN="$_SECRET_BOT_TOKEN"; fi
          # حفظ تلقائي قبل انتهاء الدورة بـ 5 دقائق ومنع خطأ خروج timeout 124/143
          rc=0
          if [ -d "HUGGINGFACE_UPLOAD" ]; then
            timeout -k 30s --signal=SIGTERM 295m xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" python HUGGINGFACE_UPLOAD/fb_operator/telegram_bot.py || rc=$?
          else
            timeout -k 30s --signal=SIGTERM 295m xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" python fb_operator/telegram_bot.py || rc=$?
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            exit "$rc"
          fi
